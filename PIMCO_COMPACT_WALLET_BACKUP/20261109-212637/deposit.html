{% extends "base.html" %}{% block content %}
<style>
.wallet{max-width:650px;margin:18px auto;padding:24px 22px;background:#191a35;border-radius:22px;color:#f7f7ff;box-sizing:border-box}.wtitle{text-align:center;color:#ffc329;font-size:25px;font-weight:900;margin:4px 0 16px}.wdesc{text-align:center;color:#b7bad0;font-size:16px;line-height:1.5;margin:0 0 24px}.wbalance{display:flex;justify-content:space-between;gap:10px;background:#292b49;border-radius:15px;padding:17px;margin-bottom:26px;font-weight:800}.wbalance strong{color:#ffc329}.wlabel{display:block;font-weight:800;margin:18px 0 9px}.winput{display:flex;align-items:center;background:#343650;border-radius:12px;overflow:hidden;min-height:58px}.wprefix{background:#292b49;color:#ffc329;font-weight:900;padding:17px 15px}.winput input,.winput select{width:100%;min-width:0;background:transparent;border:0;outline:0;color:white;padding:16px;font-size:17px}.winput input::placeholder{color:#b7bad0}.winput option{color:#111}.whint{color:#b7bad0;margin:8px 0 18px}.wbtn{width:100%;border:0;border-radius:12px;background:#ffbd1c;color:#191a35;font-weight:900;font-size:18px;padding:18px;margin-top:20px}@media(max-width:480px){.wallet{margin:8px;padding:19px 15px}.wtitle{font-size:21px}}
</style><section class="wallet"><h2 class="wtitle">＋ RECHARGE YOUR WALLET</h2><p class="wdesc">Pay via Mobile Money. Deposits are credited after payment is verified.</p><div class="wbalance"><span>▣ Recharge Balance</span><strong>UGX {{ "{:,.0f}".format(balance|default(0)) }}</strong></div><form method="post" action="{{ url_for('deposit') }}"><label class="wlabel">Recharge Amount</label><div class="winput"><span class="wprefix">UGX</span><input name="amount" type="number" min="30000" placeholder="Enter recharge amount" required></div><p class="whint">Minimum deposit: UGX 30,000</p><label class="wlabel">Mobile Money Network</label><div class="winput"><select name="network" required><option value="">Choose network</option><option value="MTN">MTN Mobile Money</option><option value="Airtel">Airtel Money</option></select></div><label class="wlabel">Mobile Money Payment Number</label><div class="winput"><input name="phone" type="tel" placeholder="e.g. 0772123456" required></div><button class="wbtn" type="submit">▣ Proceed to Recharge →</button></form><p class="whint" style="text-align:center">Secure Mobile Money Payment</p></section>{% endblock %}
