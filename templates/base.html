<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#061B2D">
<title>PIMCO AI</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css', v='bill-gold-2') }}">
</head>
<body class="{{ 'home-page' if request.endpoint == 'home' else ('my-page' if request.endpoint == 'my' else ('team-page' if request.endpoint == 'team' else ('income-page' if request.endpoint == 'income' else ('bill-page' if request.endpoint == 'bill' else '')))) }}">

<main class="page">{% with messages = get_flashed_messages(with_categories=true) %}{% if messages %}{% for category, m in messages %}<div class="notice {% if category == 'error' %}notice-error{% elif category == 'success' %}notice-success{% endif %}">{{m}}</div>{% endfor %}{% endif %}{% endwith %}{% block content %}{% endblock %}</main>
{% if session.get('user_id') %}
<a class="floating-support" href="{{ url_for('home') }}#messages" aria-label="Open customer support">
  <span class="support-online"></span>
  <svg viewBox="0 0 24 24" aria-hidden="true">
    <path d="M3 13v-1a9 9 0 0 1 18 0v1"/>
    <rect x="2.5" y="12" width="4.5" height="7" rx="2"/>
    <rect x="17" y="12" width="4.5" height="7" rx="2"/>
    <path d="M19.2 19c-.8 2-2.4 2.8-5.2 2.8h-1.5"/>
    <path d="M12 15.2h.01"/>
  </svg>
</a>
<nav class="bottom-nav" aria-label="Main navigation">
<a class="{{'active' if active=='home' else ''}}" href="{{url_for('home')}}" aria-label="Home">
<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.8 12 3l9 7.8v9.7a.8.8 0 0 1-.8.8h-5.4v-6.2H9.2v6.2H3.8a.8.8 0 0 1-.8-.8z"/></svg><small>Home</small></a>
<a class="{{'active' if active=='ai' else ''}}" href="{{url_for('ai')}}" aria-label="AI">
<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="5" width="14" height="14" rx="2"/><path d="M9 2v3m6-3v3M9 19v3m6-3v3M2 9h3m-3 6h3m14-6h3m-3 6h3M9 10h6v4H9z"/></svg><small>AI</small></a>
<a class="{{'active' if active=='team' else ''}}" href="{{url_for('team')}}" aria-label="Team">
<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.2"/><circle cx="17" cy="9" r="2.5"/><path d="M2.8 20c.3-4 2.4-6 6.2-6s5.9 2 6.2 6zm12.4-5.5c3.7-.6 6 1.2 6 5.5h-4.1"/></svg><small>Team</small></a>
<a class="{{'active' if active=='income' else ''}}" href="{{url_for('income')}}" aria-label="Income">
<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3v18h18M6 16l5-5 3 2 6-7"/><path d="M16 6h4v4"/></svg><small>Income</small></a>
<a class="{{'active' if active=='my' else ''}}" href="{{url_for('my')}}" aria-label="My">
<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="7" r="4"/><path d="M4 21c.3-5 3-7 8-7s7.7 2 8 7z"/></svg><small>My</small></a>
</nav>
{% endif %}
</body></html>
